<!DOCTYPE html>
<html lang="ru" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD Screensaver</title>
    <style>
        /* Pure black background & remove scrollbars */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <!-- Single canvas element for smooth 60fps rendering -->
    <canvas id="dvdCanvas"></canvas>

    <script>
        const canvas = document.getElementById('dvdCanvas');
        const ctx = canvas.getContext('2d');

        // Bouncing text configuration
        const text = 'ПОШЕЛ НАХУЙ';
        
        // Dynamic vibrant color palette
        const colors = [
            '#FF0055', '#00FFCC', '#FFE600', '#FF9900', 
            '#0099FF', '#9900FF', '#00FF66', '#FF007F', 
            '#00F0FF', '#39FF14', '#FFD700'
        ];

        let currentColor = colors[0];
        let x = 100;
        let y = 100;
        let dx = 3;
        let dy = 3;
        let fontSize = 64;
        let textWidth = 0;
        let textHeight = 0;

        // Calculate responsive font size and measure bounding box precisely
        function updateFontAndMetrics() {
            // Scale font size based on screen width for optimal viewing across mobile/desktop
            fontSize = Math.max(28, Math.min(Math.floor(window.innerWidth / 12), 72));
            ctx.font = `900 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            
            const metrics = ctx.measureText(text);
            textWidth = metrics.width;
            // Use precise font bounding box metrics to prevent text clipping at the bottom edge
            textHeight = metrics.actualBoundingBoxAscent || fontSize * 0.8;
        }

        // Handle canvas sizing and responsiveness
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            updateFontAndMetrics();

            // Clamp position within boundary on screen resize
            if (x + textWidth > canvas.width) x = Math.max(0, canvas.width - textWidth);
            if (y > canvas.height) y = canvas.height;
            if (y - textHeight < 0) y = textHeight;
        }

        // Pick a new vibrant color distinct from current color
        function changeColor() {
            let nextColor = colors[Math.floor(Math.random() * colors.length)];
            while (nextColor === currentColor && colors.length > 1) {
                nextColor = colors[Math.floor(Math.random() * colors.length)];
            }
            currentColor = nextColor;
        }

        // Physics & bounce update loop
        function update() {
            x += dx;
            y += dy;

            let bounced = false;

            // Bounce off Right Edge
            if (x + textWidth >= canvas.width) {
                x = canvas.width - textWidth;
                dx = -Math.abs(dx);
                bounced = true;
            } 
            // Bounce off Left Edge
            else if (x <= 0) {
                x = 0;
                dx = Math.abs(dx);
                bounced = true;
            }

            // Bounce off Bottom Edge
            if (y >= canvas.height) {
                y = canvas.height;
                dy = -Math.abs(dy);
                bounced = true;
            } 
            // Bounce off Top Edge
            else if (y - textHeight <= 0) {
                y = textHeight;
                dy = Math.abs(dy);
                bounced = true;
            }

            if (bounced) {
                changeColor();
            }
        }

        // Render frame
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.font = `900 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = currentColor;
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        // Main animation loop
        function animate() {
            update();
            draw();
            requestAnimationFrame(animate);
        }

        // Initialize window setup
        window.addEventListener('resize', resizeCanvas);

        window.onload = function() {
            resizeCanvas();
            // Start at a random direction and position
            x = Math.random() * (canvas.width - textWidth - 20) + 10;
            y = Math.random() * (canvas.height - textHeight - 40) + textHeight + 20;
            dx = Math.random() > 0.5 ? 3 : -3;
            dy = Math.random() > 0.5 ? 3 : -3;
            changeColor();
            animate();
        };
    </script>
</body>
</html>
